[project]
name = "chess-perception"
version = "0.1.0"
description = "Chess perception pipeline: camera image → piece detection → board state → best move"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.0.0",
    "python-chess>=1.9.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "roboflow>=0.2.0",
]

[tool.setuptools.packages.find]
include = ["chess_perception*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
