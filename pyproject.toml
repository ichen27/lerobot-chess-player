[project]
name = "lerobot-checkers-player"
version = "0.3.0"
description = "Checkers rules, board perception, and verified robot move planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = ["opencv-python>=4.8,<5", "numpy>=1.24,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
checkers-demo = "checkers_robot.demo:main"
checkers-play = "checkers_robot.cli:main"
checkers-inspect = "checkers_robot.vision:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["checkers_robot*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
